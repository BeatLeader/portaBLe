# portaBLe Hub — installed by Hub/deploy/setup.sh (placeholders __X__ are filled in there).
# The hub (user "portable") only writes the two map files in /etc/portable-hub/maps; everything else here is root-owned.

map $host $portable_port {
    hostnames;
    default "";
    include /etc/portable-hub/maps/hosts.map;
}

map $host $portable_auth {
    hostnames;
    default off;
    include /etc/portable-hub/maps/auth.map;
}

map $http_upgrade $portable_connection {
    default upgrade;
    ""      close;
}

# The hub: basic auth everywhere except the (HMAC-signed) GitHub webhook.
# Port 80 is served as well (not redirected) so the sites also work with Cloudflare's "Flexible" SSL mode.
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name __HUB_HOST__;

    ssl_certificate     /etc/portable-hub/tls/origin.pem;
    ssl_certificate_key /etc/portable-hub/tls/origin.key;
    client_max_body_size 2m;

    location = /api/github-webhook {
        proxy_pass http://127.0.0.1:__HUB_PORT__;
        include /etc/portable-hub/nginx/proxy.conf;
    }

    location / {
        auth_basic "portaBLe Hub";
        auth_basic_user_file /etc/portable-hub/htpasswd;
        proxy_pass http://127.0.0.1:__HUB_PORT__;
        include /etc/portable-hub/nginx/proxy.conf;
    }
}

# Deployments: host -> port from the hub's map; optional basic auth per deployment.
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name __DEPLOY_HOST_RE__;

    ssl_certificate     /etc/portable-hub/tls/origin.pem;
    ssl_certificate_key /etc/portable-hub/tls/origin.key;
    client_max_body_size 20m;

    if ($portable_port = "") {
        return 404;
    }

    location / {
        auth_basic $portable_auth;
        auth_basic_user_file /etc/portable-hub/htpasswd;
        proxy_pass http://127.0.0.1:$portable_port;
        include /etc/portable-hub/nginx/proxy.conf;
    }
}
